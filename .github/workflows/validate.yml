name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g @anthropic-ai/claude-code
      # --strict fails on warnings too
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict ./basedpyright-lsp
      # validate doesn't read .lsp.json; at least ensure it parses
      - run: for f in */.lsp.json; do jq empty "$f"; done
